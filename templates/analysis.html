<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="description" content="Comprehensive Crop Analysis - Satellite, Weather, AI Advisory"/>
<title>AgriPulse AI — Crop Analysis</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{"on-surface":"#dde4dd","primary-container":"#10b981","on-surface-variant":"#bbcabf","surface-container-high":"#242c27","secondary-container":"#0566d9","primary":"#4edea3","surface-container-highest":"#2f3632","error-container":"#93000a","on-primary-container":"#00422b","error":"#ffb4ab","surface-container":"#1a211d","background":"#0e1511","secondary":"#adc6ff","surface":"#0e1511","outline-variant":"#3c4a42","primary-fixed":"#6ffbbe","on-primary":"#003824","surface-container-low":"#161d19","outline":"#86948a","on-secondary-container":"#e6ecff"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{md:"16px",lg:"24px",sm:"8px",gutter:"20px",xs:"4px",unit:"4px","container-max":"1280px",xl:"40px"},fontFamily:{"data-mono":["JetBrains Mono"],"coordinate-xs":["JetBrains Mono"],"body-base":["Inter"],h2:["Inter"],h1:["Inter"],"body-sm":["Inter"]},fontSize:{"coordinate-xs":["11px",{lineHeight:"1.2",fontWeight:"600"}],"data-mono":["14px",{lineHeight:"1.4",letterSpacing:"0.02em",fontWeight:"500"}],"body-base":["16px",{lineHeight:"1.6",fontWeight:"400"}],h2:["24px",{lineHeight:"1.3",fontWeight:"600"}],h1:["32px",{lineHeight:"1.2",fontWeight:"600"}],"body-sm":["14px",{lineHeight:"1.5",fontWeight:"400"}]}}}}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.glass-card{background:rgba(255,255,255,.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1)}
input[type=number]{background:#1a211d;border:1px solid #3c4a42;color:#dde4dd;border-radius:6px;padding:8px 10px;width:100%;font-family:'JetBrains Mono',monospace;font-size:.85rem;outline:none;transition:border-color .2s}
input:focus{border-color:#adc6ff}
.mode-tab{flex:1;padding:10px 8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:8px;cursor:pointer;transition:all .3s;text-align:center;color:#bbcabf;font-size:.85rem}
.mode-tab.active{background:linear-gradient(135deg,#0566d9,#003b9a);border-color:#0566d9;color:#fff}
.tab-btn{padding:8px 16px;background:none;border:none;cursor:pointer;font-size:.9rem;color:#bbcabf;border-bottom:2px solid transparent;transition:all .3s;font-family:'Inter',sans-serif}
.tab-btn.active{color:#4edea3;border-bottom-color:#4edea3}
.advice-box{background:rgba(5,102,217,.1);border-left:3px solid #adc6ff;padding:14px;border-radius:6px;margin-bottom:12px}
.advice-title{font-weight:700;color:#adc6ff;margin-bottom:6px;font-size:.9rem}
.advice-text{font-size:.875rem;color:#bbcabf;line-height:1.6}
.out-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:14px}
.out-label{font-size:.75rem;color:#bbcabf;margin-bottom:4px;font-family:'JetBrains Mono',monospace}
.out-value{font-size:1.7rem;font-weight:800;color:#4edea3}
.out-unit{font-size:.72rem;color:#bbcabf;margin-top:2px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .4s ease}
</style>
</head>
<body class="bg-background text-on-surface font-body-base min-h-screen" style="background:radial-gradient(circle at top right,rgba(16,185,129,.06),transparent),#0e1511">

<!-- TOP NAV -->
<header class="fixed top-0 w-full border-b bg-slate-950/60 backdrop-blur-xl border-white/10 flex justify-between items-center px-6 h-16 z-50">
  <div class="flex items-center gap-6">
    <span class="text-xl font-black tracking-tighter text-emerald-400">AgriPulse AI</span>
    <nav class="hidden md:flex items-center gap-4">
      <a href="/" class="text-emerald-400 font-bold border-b-2 border-emerald-500 pb-0.5 text-sm">AI Analysis</a>
      <a href="/dashboard" class="text-slate-400 hover:text-emerald-300 transition-colors text-sm font-medium">Dashboard</a>
    </nav>
  </div>
  <div class="flex items-center gap-3">
    <button id="logoutBtn" class="flex items-center gap-2 px-3 py-1.5 bg-red-900/30 border border-red-500/30 text-red-400 hover:bg-red-900/50 rounded-lg text-sm font-medium transition-all">
      <span class="material-symbols-outlined text-[18px]">logout</span> Logout
    </button>
  </div>
</header>

<!-- LAYOUT: sidebar + main -->
<div class="flex min-h-screen pt-16">

  <!-- SIDEBAR INPUT PANEL -->
  <aside class="fixed left-0 top-16 h-[calc(100vh-64px)] w-[320px] border-r bg-slate-950/80 backdrop-blur-2xl border-white/10 overflow-y-auto z-40 p-5 space-y-4">

    <button class="flex items-center gap-2 text-sm text-on-surface-variant hover:text-primary transition-colors mb-2" onclick="window.location.href='/dashboard'">
      <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to Dashboard
    </button>

    <!-- Mode Tabs -->
    <div class="flex gap-2" id="modeTabs">
      <button class="mode-tab active" id="tabAuto" data-mode="auto">
        <span class="material-symbols-outlined block mx-auto mb-1 text-[20px]">satellite_alt</span>
        Smart Mode
      </button>
      <button class="mode-tab" id="tabManual" data-mode="manual">
        <span class="material-symbols-outlined block mx-auto mb-1 text-[20px]">sensors</span>
        Sensor Mode
      </button>
    </div>

    <form id="sensorForm" class="space-y-4">
      <!-- AUTO SECTION -->
      <div id="autoSection" class="space-y-4">
        <div class="glass-card rounded-xl p-4">
          <h3 class="text-sm font-bold text-on-surface mb-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[18px]">location_on</span> Your Location
          </h3>
          <button type="button" id="getLocationBtn"
            class="w-full py-2.5 bg-secondary-container text-white rounded-lg font-bold text-sm hover:brightness-110 transition-all active:scale-95 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined text-[18px]">my_location</span> Detect My Location
          </button>
          <div id="locationInfo" style="display:none" class="mt-3 glass-card rounded-lg p-3 text-center">
            <div id="locBadge" class="text-primary text-sm font-bold">Location detected</div>
            <div id="locCoords" class="text-coordinate-xs text-on-surface-variant font-data-mono mt-1"></div>
          </div>
        </div>

        <div class="glass-card rounded-xl p-4">
          <h3 class="text-sm font-bold text-on-surface mb-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[18px]">science</span> Soil Data
          </h3>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Nitrogen (N) kg/ha</label><input type="number" id="autoN" value="60" min="0" max="200"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Phosphorus (P) kg/ha</label><input type="number" id="autoP" value="40" min="0" max="150"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Potassium (K) kg/ha</label><input type="number" id="autoK" value="40" min="0" max="200"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Soil pH</label><input type="number" id="autoPH" value="6.5" min="0" max="14" step="0.1"/></div>
          </div>
        </div>
      </div>

      <!-- MANUAL SECTION -->
      <div id="manualSection" style="display:none" class="space-y-4">
        <div class="glass-card rounded-xl p-4">
          <h3 class="text-sm font-bold text-on-surface mb-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-secondary text-[18px]">thermostat</span> Weather Data
          </h3>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Temperature °C</label><input type="number" id="manualTemp" value="25" min="-20" max="50"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Humidity %</label><input type="number" id="manualHumidity" value="60" min="0" max="100"/></div>
          </div>
          <div class="mt-3"><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Rainfall mm</label><input type="number" id="manualRainfall" value="100" min="0" max="500"/></div>
        </div>
        <div class="glass-card rounded-xl p-4">
          <h3 class="text-sm font-bold text-on-surface mb-3 flex items-center gap-2">
            <span class="material-symbols-outlined text-primary text-[18px]">science</span> Soil Data
          </h3>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Nitrogen (N) kg/ha</label><input type="number" id="manualN" value="60" min="0" max="200"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Phosphorus (P) kg/ha</label><input type="number" id="manualP" value="40" min="0" max="150"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Potassium (K) kg/ha</label><input type="number" id="manualK" value="40" min="0" max="200"/></div>
            <div><label class="text-[10px] text-on-surface-variant uppercase tracking-wider block mb-1">Soil pH</label><input type="number" id="manualPH" value="6.5" min="0" max="14" step="0.1"/></div>
          </div>
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-primary text-on-primary-container font-bold rounded-lg hover:brightness-110 active:scale-95 transition-all flex items-center justify-center gap-2" style="box-shadow:0 0 20px rgba(16,185,129,.2)">
        <span class="material-symbols-outlined text-[20px]">rocket_launch</span>
        Analyze &amp; Get Advisory
      </button>
    </form>
  </aside>

  <!-- OUTPUT PANEL -->
  <main class="ml-[320px] flex-1 p-8 overflow-y-auto">
    <!-- Output Tabs -->
    <div id="resultTabs" style="display:none" class="flex flex-wrap gap-1 border-b border-outline-variant mb-6">
      <button class="tab-btn active" data-tab="analysis">Analysis</button>
      <button class="tab-btn" data-tab="disease">Disease</button>
      <button class="tab-btn" data-tab="mandi">Mandi Prices</button>
      <button class="tab-btn" data-tab="news">News</button>
      <button class="tab-btn" data-tab="chatbot">AI Chatbot</button>
      <button class="tab-btn" data-tab="alerts">SMS Alerts</button>
    </div>

    <div id="outputContent" class="min-h-[60vh] flex items-center justify-center">
      <div class="text-center text-on-surface-variant space-y-3">
        <span class="material-symbols-outlined text-6xl block opacity-30">agriculture</span>
        <p class="text-lg">Enter your soil data and click<br/><strong class="text-primary">Analyze &amp; Get Advisory</strong></p>
        <p class="text-sm opacity-60">Smart Mode auto-fetches weather &amp; satellite data via GPS</p>
      </div>
    </div>
  </main>
</div>

<script>
const html = document.documentElement;
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/logout', { method: 'POST' });
  window.location.href = '/login';
});

// Mode switching
document.getElementById('tabAuto').addEventListener('click', () => {
  document.getElementById('autoSection').style.display = 'block';
  document.getElementById('manualSection').style.display = 'none';
  document.getElementById('tabAuto').classList.add('active');
  document.getElementById('tabManual').classList.remove('active');
});
document.getElementById('tabManual').addEventListener('click', () => {
  document.getElementById('autoSection').style.display = 'none';
  document.getElementById('manualSection').style.display = 'block';
  document.getElementById('tabAuto').classList.remove('active');
  document.getElementById('tabManual').classList.add('active');
});

// Get location
document.getElementById('getLocationBtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const { latitude, longitude } = position.coords;
        document.getElementById('locationInfo').style.display = 'block';
        document.getElementById('locCoords').textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
        document.getElementById('getLocationBtn').innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Location Detected';
        document.getElementById('getLocationBtn').style.opacity = '0.7';
        fetch('/api/weather', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ latitude, longitude })
        }).then(r => r.json()).then(data => {
          document.getElementById('autoN').value = data.N || 60;
          document.getElementById('autoP').value = data.P || 40;
          document.getElementById('autoK').value = data.K || 40;
          document.getElementById('autoPH').value = data.pH || 6.5;
        });
      },
      () => alert('Unable to get location. Please use Sensor Mode.')
    );
  }
});

// Form submission
document.getElementById('sensorForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mode = document.getElementById('tabAuto').classList.contains('active') ? 'auto' : 'manual';
  const data = {
    mode,
    N: parseFloat(document.getElementById(mode === 'auto' ? 'autoN' : 'manualN').value),
    P: parseFloat(document.getElementById(mode === 'auto' ? 'autoP' : 'manualP').value),
    K: parseFloat(document.getElementById(mode === 'auto' ? 'autoK' : 'manualK').value),
    pH: parseFloat(document.getElementById(mode === 'auto' ? 'autoPH' : 'manualPH').value)
  };
  if (mode === 'manual') {
    data.temperature = parseFloat(document.getElementById('manualTemp').value);
    data.humidity = parseFloat(document.getElementById('manualHumidity').value);
    data.rainfall = parseFloat(document.getElementById('manualRainfall').value);
  }

  const btn = document.querySelector('#sensorForm button[type=submit]');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">autorenew</span> Analyzing...';
  document.getElementById('outputContent').innerHTML = `<div class="text-center text-on-surface-variant space-y-3 py-20">
    <span class="material-symbols-outlined text-5xl block text-primary animate-spin">autorenew</span>
    <p class="text-lg">Running AI Analysis...</p>
  </div>`;

  try {
    const response = await fetch('/api/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const result = await response.json();
    if (result.success) {
      document.getElementById('resultTabs').style.display = 'flex';
      displayResults(result);
    } else {
      alert('Error: ' + result.error);
      document.getElementById('outputContent').innerHTML = '<p class="text-error text-center py-20">Analysis failed. Please try again.</p>';
    }
  } catch (error) {
    alert('Error: ' + error.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<span class="material-symbols-outlined text-[20px]">rocket_launch</span> Analyze &amp; Get Advisory';
  }
});

function displayResults(data) {
  const cropName = data.crop?.name || data.summary?.crop || 'Unknown';
  const yieldValue = data.yield?.value || 0;
  const priceValue = data.price?.value || 0;
  const mspValue = data.price?.msp || 0;
  const profitValue = data.profit?.value || 0;
  const ndviValue = data.ndvi?.ndvi || 0;
  const ndviHealth = data.ndvi?.health || 'Unknown';

  const advisory = data.advisory || {};
  const advisories = advisory.advisories || [];

  let html = `<div class="space-y-6 fade-in">
    <div class="glass-card rounded-xl p-6 flex items-center gap-4">
      <span class="material-symbols-outlined text-5xl text-primary" style="font-variation-settings:'FILL' 1">grass</span>
      <div>
        <p class="text-coordinate-xs text-on-surface-variant uppercase tracking-widest">Best Crop Recommendation</p>
        <h2 class="text-4xl font-black text-primary">${cropName}</h2>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="glass-card rounded-xl p-4">
        <div class="out-label">Expected Yield</div>
        <div class="out-value">${(yieldValue||0).toFixed(2)}</div>
        <div class="out-unit">tons/hectare</div>
      </div>
      <div class="glass-card rounded-xl p-4">
        <div class="out-label">Market Price</div>
        <div class="out-value text-secondary">₹${Math.round(priceValue||0)}</div>
        <div class="out-unit">per quintal</div>
      </div>
      <div class="glass-card rounded-xl p-4">
        <div class="out-label">Profit Potential</div>
        <div class="out-value">₹${((profitValue||0)/1000).toFixed(1)}K</div>
        <div class="out-unit">per hectare</div>
      </div>
      <div class="glass-card rounded-xl p-4">
        <div class="out-label">NDVI Health</div>
        <div class="out-value text-secondary">${(ndviValue||0).toFixed(2)}</div>
        <div class="out-unit">${ndviHealth}</div>
      </div>
    </div>`;

  const alerts = data.alerts;
  if (alerts && (alerts.critical || alerts.warning)) {
    const alertData = alerts.critical || alerts.warning || {};
    html += `<div class="glass-card rounded-xl p-4 border-l-4 border-error">
      <div class="font-bold text-error mb-1">${alertData.title || 'Alert'}</div>
      <p class="text-body-sm text-on-surface-variant">${alertData.message || ''}</p>
    </div>`;
  }

  html += `<div class="glass-card rounded-xl p-6 space-y-3">
    <h3 class="font-bold text-on-surface flex items-center gap-2">
      <span class="material-symbols-outlined text-primary text-[20px]">psychology</span> AI-Powered Advisory
    </h3>
    <div class="advice-box">
      <div class="advice-title">Crop Selection Recommendation</div>
      <div class="advice-text">Based on your soil nutrients, weather conditions, and market analysis, <strong>${cropName}</strong> is the optimal crop choice for maximum yield and profitability.</div>
    </div>`;

  if (advisory.seasonal_tip) html += `<div class="advice-box"><div class="advice-title">Seasonal Insight</div><div class="advice-text">${advisory.seasonal_tip}</div></div>`;
  if (advisory.market_insight) html += `<div class="advice-box"><div class="advice-title">Market Insight</div><div class="advice-text">${advisory.market_insight}</div></div>`;

  if (advisories.length > 0) {
    html += `<div class="advice-box"><div class="advice-title">Additional Recommendations</div><ul class="space-y-1 mt-2">`;
    advisories.slice(0,5).forEach(adv => {
      const t = typeof adv === 'string' ? adv : (adv.text || adv.title || adv.message || '');
      if (t) html += `<li class="text-body-sm text-on-surface-variant flex items-start gap-2"><span class="material-symbols-outlined text-primary text-[14px] mt-0.5">check_circle</span>${t}</li>`;
    });
    html += `</ul></div>`;
  }

  html += `</div></div>`;
  document.getElementById('outputContent').innerHTML = html;
}
</script>
</body>
</html>
